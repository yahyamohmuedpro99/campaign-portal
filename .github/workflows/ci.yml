name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      PROVIDER_BASE_URL: ${{ secrets.PROVIDER_BASE_URL }}
      PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      SHARE_SESSION_SECRET: ${{ secrets.SHARE_SESSION_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SEED_PASSWORD_KILELE_OWNER: ${{ secrets.SEED_PASSWORD_KILELE_OWNER }}
      SEED_PASSWORD_KILELE_ANALYST: ${{ secrets.SEED_PASSWORD_KILELE_ANALYST }}
      SEED_PASSWORD_KAROO_OWNER: ${{ secrets.SEED_PASSWORD_KAROO_OWNER }}
      SEED_PASSWORD_KAROO_ANALYST: ${{ secrets.SEED_PASSWORD_KAROO_ANALYST }}
      SEED_PASSWORD_MARRAKECH_OWNER: ${{ secrets.SEED_PASSWORD_MARRAKECH_OWNER }}
      SEED_PASSWORD_MARRAKECH_ANALYST: ${{ secrets.SEED_PASSWORD_MARRAKECH_ANALYST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The isolation suite is the reason this job exists. R1 and R2 fail if any table in
      # the public schema loses row-level security or its policy, including a table added
      # long after this was written, and R16 disables RLS inside a transaction to prove
      # that isolation actually comes from the database rather than from application code.
      - name: Tests, including the data-isolation regression suite
        run: pnpm vitest run --reporter=verbose

  deploy:
    name: Deploy to production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Migrations run before the code that depends on them. Skipped, with a warning
      # rather than a failure, when no Supabase access token is configured.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; migrations were not applied."
            exit 0
          fi
          npx --yes supabase@latest link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Build and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Anything that would otherwise stop to ask a question fails instead. A deploy
          # step that waits silently for input is indistinguishable from a slow build
          # until the job times out twelve minutes later.
          CI: "true"
          VERCEL_CLI_VERSION: "59.16.0"
        run: |
          set -euo pipefail
          vercel() { npx --yes "vercel@$VERCEL_CLI_VERSION" "$@" --token "$VERCEL_TOKEN" --yes; }
          timeout 120 bash -c "$(declare -f vercel); vercel pull --environment=production"
          timeout 600 bash -c "$(declare -f vercel); vercel build --prod"
          timeout 300 bash -c "$(declare -f vercel); vercel deploy --prebuilt --prod" | tee deployment-url.txt
          echo "Deployed: $(tail -1 deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"

      # A deployment that builds but cannot serve a page is not a deployment.
      - name: Smoke test the live site
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          set -e
          for path in /api/health /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          # An unknown share link must look identical to one that never existed.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/share/definitely-not-a-real-token")
          echo "/share/<unknown> -> $code"
          [ "$code" = "404" ] || { echo "::error::unknown share link returned $code"; exit 1; }
